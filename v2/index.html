<style>
/* Study OS v2 — VOICE: sobre, précis, motivant sans être un jeu.
   COLOUR: fond neutre, encre, une teinte par matière. TYPE: Geist.
   LAYOUT: barre latérale (ordinateur), onglets en bas (téléphone). */
:root{color-scheme:light dark;--bg:light-dark(#f6f6f4,#0d0e11);--card:light-dark(#ffffff,#16181d);--ink:light-dark(#14161b,#ecedf0);--mute:light-dark(#6a6f7c,#9298a6);--line:light-dark(#e7e7e3,#262931);--soft:light-dark(#f0f0ed,#1d2026);--acc:light-dark(#2747d0,#8ea2ff);
--m1:light-dark(#2f54d6,#7f9bff);--m2:light-dark(#c2560e,#ff9a5c);--m3:light-dark(#0f7a70,#4fd1c0);--m4:light-dark(#7a3fc2,#c39bff);
--ok:light-dark(#14805e,#4cc79a);--warn:light-dark(#b26200,#f3a64b);--bad:light-dark(#c0262d,#ff7b82);--r:16px;--sh:light-dark(0 1px 2px #0000000d,0 1px 2px #00000066)}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Geist,system-ui,sans-serif;overflow-x:clip;font-feature-settings:"tnum" 1}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(24px,3.2vw,32px)}h2{font-size:16.5px}h3{font-size:14.5px}
a{color:var(--acc)}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{font-weight:700;font-size:17px;padding:4px 10px 14px;display:flex;gap:10px;align-items:center}.brand i{width:26px;height:26px;border-radius:8px;background:var(--ink);display:grid;place-items:center;color:var(--bg);font-style:normal;font-size:13px}
.nav{display:grid;gap:1px}.nav small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:12px 12px 4px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:10px;color:var(--mute);text-decoration:none;font-weight:500;min-height:40px}
.nav a svg{width:18px;height:18px;flex:none}.nav a[aria-current]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.nav a .cnt{margin-left:auto;font-size:11.5px;background:var(--soft);border-radius:99px;padding:0 7px;color:var(--mute)}
.side .foot{margin-top:auto;font-size:12px;color:var(--mute);padding:10px}
main{padding:26px clamp(16px,4vw,40px) 60px;max-width:1240px;width:100%}
.top{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:18px}.top p{margin:4px 0 0;color:var(--mute);max-width:70ch}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:0 13px;min-height:34px;font:inherit;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .sw{width:8px;height:8px;border-radius:50%}
.seg{display:inline-flex;background:var(--soft);border-radius:11px;padding:3px;gap:2px}.seg button{min-height:32px;background:none;border:0;color:var(--mute);padding:0 12px;border-radius:8px;font-size:13.5px}.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card>h2,.card>header{margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card.flat{box-shadow:none}
.g{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.span{grid-column:1/-1}
.kpi{display:grid;gap:2px}.kpi small{color:var(--mute);font-size:12.5px}.kpi b{font-size:24px;font-weight:600;line-height:1.15}.kpi span{font-size:12.5px;color:var(--mute)}
.delta{font-size:12.5px;font-weight:500}.up{color:var(--ok)}.dn{color:var(--bad)}.eq{color:var(--mute)}
.fig{position:relative;height:340px}.fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.list{display:grid}.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.row.click{cursor:pointer}.row.click:hover .ttl{color:var(--acc)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}.when{font-size:13px;color:var(--mute);white-space:nowrap}.ttl{font-weight:500}.sub{font-size:12.5px;color:var(--mute)}
.tag{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--mute);white-space:nowrap;display:inline-block}.tag.w{color:var(--warn)}.tag.b{color:var(--bad)}.tag.o{color:var(--ok)}.tag.a{color:var(--acc)}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-weight:500;color:var(--mute);font-size:12px;padding:8px;border-bottom:1px solid var(--line)}td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}td.n,th.n{text-align:right;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--soft);position:relative;min-width:60px;overflow:visible}.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--ink)}.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.lvl{display:inline-flex;gap:3px}.lvl i{width:16px;height:6px;border-radius:2px;background:var(--soft)}.lvl i.on{background:var(--c,var(--ink))}
button,.btn{font:inherit;font-weight:500;min-height:40px;padding:0 15px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none;font-size:14.5px}
button.sec,.btn.sec{background:var(--card);color:var(--ink);border-color:var(--line)}button.link{background:none;border:0;color:var(--mute);min-height:30px;padding:0 6px}button.link:hover{color:var(--ink)}button.sm,.btn.sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}button:disabled{opacity:.45;cursor:default}
button.icon{min-height:32px;width:32px;padding:0;border-radius:8px;background:none;border:1px solid var(--line);color:var(--ink)}
input,select,textarea{font:inherit;font-size:16px;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 11px;min-height:42px}textarea{min-height:90px;resize:vertical}input[type=checkbox],input[type=radio]{width:18px;min-height:18px;accent-color:var(--ink)}
label{display:grid;gap:5px;font-size:12.5px;color:var(--mute)}label.inl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.f{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));align-items:end}.f .w{grid-column:1/-1}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
dialog{border:0;border-radius:20px;background:var(--card);color:var(--ink);padding:22px;width:min(620px,94vw);max-height:90vh;box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0006}
dialog h2{margin-bottom:14px}.dact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.dact .l{margin-right:auto}
.doc{font-size:15px;line-height:1.6}.doc h3{margin:16px 0 6px;font-size:15.5px}.doc p{margin:6px 0}.doc ol,.doc ul{margin:6px 0;padding-left:22px}
pre.box{white-space:pre-wrap;font:13px/1.5 ui-monospace,Consolas,monospace;background:var(--soft);border-radius:10px;padding:12px;max-height:300px;overflow:auto;margin:8px 0}
details{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}summary{cursor:pointer;color:var(--acc);font-weight:500;min-height:30px}
.banner[hidden]{display:none}.banner{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}.banner.ok{background:color-mix(in srgb,var(--ok) 12%,var(--card))}.banner.err{background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.mt{margin-top:14px}.mt0{margin-top:0}.sp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}.right{margin-left:auto}
.note{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.tabbar{display:none}
.login{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--bg);padding:20px}.login[hidden]{display:none}
.loading{display:flex;gap:10px;align-items:center;color:var(--mute);font-size:14px}.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
section[hidden]{display:none}
/* priorités */
.prio{display:grid;gap:10px}.prio .p{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--soft)}.prio .p b.n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px}
.prog{display:grid;gap:4px}.prog .bar{height:8px;border-radius:4px}
/* agenda */
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}.days button{flex:none;display:grid;justify-items:center;gap:0;min-width:52px;min-height:58px;padding:6px 8px;border-radius:14px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500}.days button small{font-size:11px;color:var(--mute);font-weight:400}.days button b{font-size:17px}.days button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.days button[aria-pressed=true] small{color:inherit;opacity:.7}.days i{width:5px;height:5px;border-radius:50%;background:var(--acc);margin-top:2px}.days button.today:not([aria-pressed=true]){border-color:var(--acc)}
.dayg{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.tl{position:relative;margin-left:44px;--h:56px;user-select:none;touch-action:pan-y}
.tl .hr{position:absolute;left:-44px;right:0;border-top:1px solid var(--line);font-size:11px;color:var(--mute)}.tl .hr span{position:absolute;top:-8px;left:0;background:var(--card);padding-right:6px}
.blk{position:absolute;border-radius:12px;padding:5px 8px 5px 12px;overflow:hidden;font-size:13px;line-height:1.3;background:var(--soft);border:1px solid var(--line);display:flex;gap:8px;cursor:default}
.blk::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:4px;border-radius:2px;background:var(--c,var(--mute))}
.blk .ic{width:22px;height:22px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:13px;background:color-mix(in srgb,var(--c) 18%,transparent)}
.blk .bt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.blk .bs{color:var(--mute);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.blk.fix{background:transparent;border-style:dashed}
.blk.work{background:color-mix(in srgb,var(--c) 12%,var(--card));border-color:color-mix(in srgb,var(--c) 35%,var(--line));cursor:grab}.blk.work.drag{cursor:grabbing;box-shadow:0 8px 24px #0003;z-index:5;opacity:.9}
.blk.done{opacity:.5}.blk.done .bt{text-decoration:line-through}.blk.late{border-color:var(--bad)}.blk.late .bs{color:var(--bad)}
.blk .bx{margin-left:auto;display:flex;gap:4px;align-items:flex-start}.blk input{margin:2px 0 0}
.blk .rz{position:absolute;left:0;right:0;bottom:0;height:9px;cursor:ns-resize}
.now{position:absolute;left:-6px;right:0;border-top:2px solid var(--bad);z-index:3;pointer-events:none}.now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.meter{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute);margin-bottom:14px}.meter .bar{flex:1}
.week{display:grid;grid-template-columns:40px repeat(7,minmax(0,1fr));gap:0;position:relative}
.week .wh{font-size:12px;color:var(--mute);text-align:center;padding:6px 2px;border-bottom:1px solid var(--line);cursor:pointer}.week .wh b{display:block;font-size:16px;color:var(--ink)}.week .wh.today b{color:var(--acc)}
.week .wc{position:relative;border-left:1px solid var(--line)}.week .wt{position:relative}.week .wt span{position:absolute;right:6px;font-size:10.5px;color:var(--mute);transform:translateY(-7px)}
.week .wb{position:absolute;left:2px;right:2px;border-radius:7px;font-size:11px;line-height:1.2;padding:2px 4px;overflow:hidden;background:color-mix(in srgb,var(--c) 16%,var(--card));border-left:3px solid var(--c);cursor:pointer}.week .wb.fix{background:transparent;border:1px dashed var(--line);border-left:3px solid var(--c);color:var(--mute)}
.week .wb.done{opacity:.5;text-decoration:line-through}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.month .mh{font-size:12px;color:var(--mute);text-align:center;padding:4px}
.month .md{min-height:92px;border:1px solid var(--line);border-radius:10px;padding:5px;background:var(--card);cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:11.5px}.month .md.out{opacity:.4}.month .md.today{border-color:var(--acc)}.month .md b{font-size:13px}
.month .md .ev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:5px;padding:0 4px;background:color-mix(in srgb,var(--c) 15%,transparent)}
.month .md.busy{background:color-mix(in srgb,var(--warn) 6%,var(--card))}
.subt{display:grid;gap:6px;margin-top:6px}.subt label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
/* exercices / examen */
.ex{border:1px solid var(--line);border-radius:14px;padding:14px;margin:0}.ex header{display:flex;justify-content:space-between;gap:10px;align-items:start;margin-bottom:6px}
.chrono{font-size:40px;font-weight:600;letter-spacing:-.02em}
.rate{display:flex;gap:8px;flex-wrap:wrap}.rate button{flex:1;min-width:110px}
.mic{width:76px;height:76px;border-radius:50%;font-size:28px}.mic.on{background:var(--bad);border-color:var(--bad)}
.menu{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}.menu a{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:500}.menu a svg{width:20px;height:20px}
@media(max-width:980px){.dayg{grid-template-columns:1fr}}
@media(max-width:760px){
 .app{grid-template-columns:1fr}.side{display:none}
 main{padding:calc(14px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}
 .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:light-dark(#ffffffee,#16181dee);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
 .tabbar a{display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--mute);text-decoration:none;min-height:48px;padding-top:4px}.tabbar a svg{width:22px;height:22px}.tabbar a[aria-current]{color:var(--ink)}
 .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-14px;padding-inline:14px}.chip{flex:none}.top{margin-bottom:12px}
 .fig{height:260px}.card{padding:14px}
 table.st thead{display:none}table.st tr{display:grid;grid-template-columns:1fr auto;padding:8px 0;border-bottom:1px solid var(--line)}table.st td{border:0;padding:2px 0}
 .week{grid-template-columns:30px repeat(7,minmax(0,1fr))}.week .wb{font-size:9.5px;padding:1px 2px}.month .md{min-height:58px;font-size:10px}.month .md .ev{display:none}.month .md .dots{display:flex}
 .chrono{font-size:32px}
}
.month .md .dots{display:none;gap:2px;flex-wrap:wrap}.month .md .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
@media(prefers-reduced-motion:no-preference){section:not([hidden]){animation:fi .2s ease-out}@keyframes fi{from{opacity:0;transform:translateY(3px)}}}
@media print{.side,.tabbar,button{display:none!important}.app{display:block}}
@media(max-width:900px){#homeGrid,#revGrid,#examGrid{grid-template-columns:1fr!important}}
.test-flag{position:fixed;right:10px;top:10px;z-index:40;background:var(--warn);color:#fff;font-size:12px;padding:3px 9px;border-radius:99px;pointer-events:none}
.tag.wrap{white-space:normal}

<script>
{
/* ================= CORE ================= */
const VERSION='2.0';
const MAT0=['Mathématiques','Physique-Chimie','Mathématiques Expertes'];
const SH0={'Mathématiques':'Maths','Physique-Chimie':'Physique-chimie','Mathématiques Expertes':'Maths expertes'};
const COL0={'Mathématiques':'var(--m1)','Physique-Chimie':'var(--m2)','Mathématiques Expertes':'var(--m3)'};
const COLS=['config','notes','seances','taches','controles','erreurs','competences','planning','bilans','sujets','profils','blocs',
 'inbox','recurrences','exercices','examens','analyses','revisions','documents','questions','objectifs','defis'];
const S=Object.fromEntries(COLS.map(c=>[c,[]]));
let sb=null,me=null,loaded=false,cur='accueil';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
/* dates */
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TD=()=>iso(new Date());
const dt=d=>new Date(d+'T12:00');
const addD=(d,n)=>{const x=dt(d);x.setDate(x.getDate()+n);return iso(x)};
const diffD=(a,b)=>Math.round((dt(b)-dt(a))/864e5);
const monday=d=>{const x=dt(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)};
const fd=(d,o={day:'numeric',month:'short'})=>d?dt(d).toLocaleDateString('fr-FR',o):'';
const fdl=d=>{const s=dt(d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});return s[0].toUpperCase()+s.slice(1)};
const rel=d=>{const n=diffD(TD(),d);return n===0?'aujourd’hui':n===1?'demain':n===-1?'hier':n>1&&n<7?fd(d,{weekday:'long'}):fd(d,{weekday:'short',day:'numeric',month:'short'})};
const mn=t=>{if(t==null||t==='')return null;const[h,m]=String(t).split(':').map(Number);return h*60+(m||0)};
const hh=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(Math.round(m%60)).padStart(2,'0');
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const dur=(a,b)=>{const x=mn(a),y=mn(b);return x==null||y==null?0:Math.max(0,(y===0?1440:y)-x)};
const fh=m=>m>=60?Math.floor(m/60)+' h'+(m%60?' '+String(m%60).padStart(2,'0'):''):m+' min';
/* nombres */
const nf=(x,d=2)=>x==null||isNaN(x)?'—':(+x).toFixed(d).replace('.',',');
const nfs=x=>x==null||isNaN(x)?'—':String(Math.round(x*100)/100).replace('.',',');
const num=v=>{if(v===''||v==null)return null;const n=+String(v).replace(',','.');return isNaN(n)?null:n};
/* réglages */
const cfg=()=>S.config.find(c=>c.id==='profil')||{};
const R=()=>({objectif:16,maxSoir:120,coucher:'23:30',gaps:[1,3,5,10],matieresSup:[],...(S.config.find(c=>c.id==='reglages')||{})});
const MAT=()=>[...MAT0,...(R().matieresSup||[])];
const SH=m=>SH0[m]||m||'';
const PAL=['var(--m4)','#8a7b2e','#a1306a','#4b6b8a','#5d7a2c'];
const COL=m=>COL0[m]||(m&&MAT().includes(m)?PAL[(MAT().indexOf(m)-3)%PAL.length]:'var(--mute)');
/* persistance */
const banner=(t,kind='',ms=0)=>{const b=$('#banner');b.hidden=!t;b.className='banner '+kind;b.innerHTML=t?`<span>${t}</span><button class="link" onclick="this.parentNode.hidden=true" aria-label="Fermer">✕</button>`:'';if(ms)setTimeout(()=>{if(b.innerHTML.includes(t))b.hidden=true},ms)};
const toast=t=>banner(esc(t),'ok',3500);
let rq=0;const later=()=>{if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render()})};
async function put(c,o,quiet){o.id=o.id||uid();o.maj=new Date().toISOString();const i=S[c].findIndex(x=>x.id===o.id);i>=0?S[c][i]=o:S[c].push(o);cache();if(!quiet)later();if(!sb||!me)return o;const{id,...data}=o;const{error}=await sb.from('docs').upsert({collection:c,id,data,updated_at:o.maj});if(error)banner('Enregistrement impossible : '+esc(error.message)+'. Vérifie la connexion, la modification est gardée sur cet appareil.','err');return o}
async function putMany(c,arr){for(const o of arr){o.id=o.id||uid();o.maj=new Date().toISOString();const i=S[c].findIndex(x=>x.id===o.id);i>=0?S[c][i]=o:S[c].push(o)}cache();later();if(!sb||!me||!arr.length)return;const{error}=await sb.from('docs').upsert(arr.map(({id,...data})=>({collection:c,id,data,updated_at:data.maj})));if(error)banner('Enregistrement impossible : '+esc(error.message),'err')}
const patch=(c,id,ch)=>{const x=S[c].find(y=>y.id===id);return x?put(c,{...x,...ch}):null};
async function del(c,id){S[c]=S[c].filter(x=>x.id!==id);cache();later();if(sb&&me){const{error}=await sb.from('docs').delete().eq('collection',c).eq('id',id);if(error)banner('Suppression impossible : '+esc(error.message),'err')}}
let ct=0;const cache=()=>{clearTimeout(ct);ct=setTimeout(()=>{try{localStorage.setItem('sos_cache',JSON.stringify(S))}catch(e){}},400)};
/* dialogue générique : onOk(valeurs) — retourner false garde la fenêtre ouverte */
let askN=0;function ask(title,html,okLbl,onOk,opt={}){const d=$('#dlg'),my=++askN;$('#dlgT').textContent=title;$('#dlgB').innerHTML=html;$('#dlgB').className=opt.plain?'':'f';$('#dlgOk').textContent=okLbl||'OK';$('#dlgOk').hidden=!okLbl;
 d.style.width=opt.wide?'min(900px,96vw)':'';$('#dlgA .l')?.remove();if(opt.left){const b=document.createElement('button');b.type='button';b.className='sec l';b.textContent=opt.left[0];b.onclick=()=>{d.close();opt.left[1]()};$('#dlgA').prepend(b)}
 $('#dlgA button[value=cancel]').textContent=opt.cancel||(okLbl?'Annuler':'Fermer');
 d.showModal();if(opt.after)opt.after($('#dlgB'));
 $('#dlgF').onsubmit=async e=>{if(e.submitter?.value!=='ok')return;e.preventDefault();const f=new FormData($('#dlgF'));const v={};for(const[k,x]of f.entries()){if(k in v){v[k]=[].concat(v[k],x)}else v[k]=x}const r=await onOk(v,$('#dlgB'));if(r!==false&&askN===my)d.close()}}
const confirmDo=(t,txt,lbl,fn)=>ask(t,`<p style="margin:0;color:var(--mute)">${txt}</p>`,lbl,fn,{plain:true});
const sel=(n,opts,v,attr='')=>`<select name="${n}" ${attr}>${opts.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v??'')?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
const inp=(lab,n,v='',t='text',x='')=>{const w=/^w(\s|$)/.test(x);return `<label ${w?'class="w"':''}>${lab}<input type="${t}" name="${n}" value="${esc(v)}" ${x.replace(/^w(\s|$)/,'')}></label>`};
/* texte riche minimal (gras, listes, retours) + formules via KaTeX */
function md(t){const L=esc(t||'').split('\n');let h='',ul=false;for(let l of L){const m=l.match(/^\s*[-•*]\s+(.*)/);if(m){if(!ul){h+='<ul>';ul=true}h+='<li>'+inl(m[1])+'</li>';continue}if(ul){h+='</ul>';ul=false}if(/^#{1,4}\s/.test(l))h+='<h3>'+inl(l.replace(/^#+\s/,''))+'</h3>';else if(l.trim())h+='<p>'+inl(l)+'</p>'}if(ul)h+='</ul>';return h}
const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
function tex(el){if(!el||!window.renderMathInElement)return;try{renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}],throwOnError:false})}catch(e){}}
async function save(fn,blob){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){try{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(_){return false}}}
const chipsM=(cur,attr='data-m',all=true)=>`<div class="chips">${[...(all?['']:[]),...MAT()].map(m=>`<button class="chip" aria-pressed="${m===cur}" ${attr}="${esc(m)}">${m?`<span class="sw" style="background:${COL(m)}"></span>${esc(SH(m))}`:'Tout'}</button>`).join('')}</div>`;
const lvl=(n,max=4,c)=>`<span class="lvl" style="--c:${c||'var(--ink)'}">${Array.from({length:max},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</span>`;
/* chapitres du programme (suggestions ; on peut en saisir d'autres) */
const CHAP={'Mathématiques':['Suites et récurrence','Limites de suites','Limites de fonctions','Continuité','Dérivation et convexité','Fonction exponentielle','Fonction logarithme','Fonctions trigonométriques','Primitives et équations différentielles','Calcul intégral','Probabilités conditionnelles','Loi binomiale','Sommes de variables aléatoires','Concentration et loi des grands nombres','Dénombrement','Géométrie dans l’espace','Orthogonalité et distances','Représentations paramétriques et équations','Algorithmique (Python)'],
'Physique-Chimie':['Transformations acide-base','Méthodes physiques d’analyse','Méthodes chimiques d’analyse (titrages)','Cinétique chimique','Mouvement et deuxième loi de Newton','Mouvement dans un champ uniforme','Mouvement des satellites (Kepler)','Mécanique des fluides','Thermodynamique','Ondes (diffraction, interférences, Doppler)','Lunette astronomique','Effet photoélectrique','Circuits RC','Radioactivité','Évolution spontanée et équilibres','Piles et électrolyse','Synthèse organique'],
'Mathématiques Expertes':['Nombres complexes (forme algébrique)','Nombres complexes (forme géométrique)','Polynômes et équations','Divisibilité et congruences','PGCD et théorème de Bézout','Nombres premiers','Graphes et matrices','Matrices et suites']};
const chapList=m=>{const s=new Set(CHAP[m]||[]);for(const c of['notes','exercices','erreurs','revisions','documents','examens'])for(const x of S[c])if((!m||x.matiere===m))for(const t of chapsOf(x))s.add(t);return[...s]};
const chapsOf=x=>[].concat(x.chapitres||[],x.chapitre&&!/^(interro|ds\b|ds\s|dm\b|eval|\(sans|compte rendu|bac blanc)/i.test(x.chapitre)?[x.chapitre]:[]).flatMap(t=>String(t).split(/\s*[;,]\s*/)).filter(Boolean);
const dlChap=(m,id='dlc')=>`<datalist id="${id}">${chapList(m).map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`;
const ICONS={cours:'📘',devoir:'✏️',revision:'🧠',ds:'📝',entrainement:'🎯',travail:'✏️',sport:'⚽',perso:'⭐',trajet:'🚌',sommeil:'🌙',lecture:'📖',oral:'🎙️',pause:'☕'};
const CATS=[['revision','Révision'],['devoir','Devoir'],['entrainement','Exercices / entraînement'],['ds','DS / contrôle'],['cours','Cours'],['oral','Oral'],['lecture','Lecture'],['sport','Sport'],['perso','Personnel'],['pause','Pause']];
const isWork=k=>['travail','revision','devoir','entrainement','ds','oral','lecture'].includes(k||'travail');

/* ================= DONNÉES CALCULÉES ================= */
const pts=x=>x.note===''||x.note==null?null:+x.note;
const n20=x=>pts(x)==null||!+x.bareme?null:pts(x)/(+x.bareme)*20;
const coef=x=>x.coef===''||x.coef==null?1:+x.coef;
const grp20=x=>{if(!x.moyGroupe)return null;const m=String(x.moyGroupe).replace(/,/g,'.').match(/([\d.]+)(?:\/([\d.]+))?/);return m?+m[1]/(+(m[2]||20))*20:null};
const official=x=>x.statut==='Renseignée'&&pts(x)!=null&&+x.bareme>0;
/* périodes scolaires (année = depuis le 1er août) */
const yStart=()=>{const n=new Date();return (n.getMonth()>=7?n.getFullYear():n.getFullYear()-1)+'-08-01'};
const PERS={'':'Toute l’année',T1:'Trimestre 1',T2:'Trimestre 2',T3:'Trimestre 3',S1:'Semestre 1',S2:'Semestre 2'};
const PM={T1:[8,9,10,11],T2:[12,1,2,3],T3:[4,5,6,7],S1:[8,9,10,11,12,1],S2:[2,3,4,5,6,7]};
const PREV={T2:'T1',T3:'T2',S2:'S1'};
const inPer=(d,p)=>!p||!d?true:PM[p].includes(+d.slice(5,7));
const notesOf=(m,p)=>S.notes.filter(x=>(!m||x.matiere===m)&&official(x)&&x.date>=yStart()&&inPer(x.date,p)).sort((a,b)=>a.date.localeCompare(b.date));
/* moyenne Pronote : Σ(points×coef) / Σ(barème×coef) × 20 */
function avg(m,p,list){const r=list||notesOf(m,p);let a=0,b=0;for(const x of r){a+=pts(x)*coef(x);b+=x.bareme*coef(x)}return b?a/b*20:null}
function avgG(m,p){let a=0,b=0;for(const x of notesOf(m,p)){const g=grp20(x);if(g==null)continue;a+=g/20*x.bareme*coef(x);b+=x.bareme*coef(x)}return b?a/b*20:null}
/* moyenne générale = moyenne simple des moyennes de matières disponibles (coefficients de matières inconnus) */
function avgAll(p){const v=MAT().map(m=>avg(m,p)).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
/* tendance : au moins 4 notes ; moyenne des 3 dernières vs 3 précédentes, seuil 1 point */
function trend(m,p){const r=notesOf(m,p).map(n20);if(r.length<4)return{k:'',t:`Échantillon insuffisant (${r.length} note${r.length>1?'s':''})`,d:null};
 const last=r.slice(-3),prev=r.slice(-6,-3),a=last.reduce((s,x)=>s+x,0)/last.length,b=prev.reduce((s,x)=>s+x,0)/prev.length,d=a-b;
 return d>=1?{k:'up',t:'Progression',d}:d<=-1?{k:'dn',t:'Régression',d}:{k:'eq',t:'Stagnation',d}}
/* temps de travail */
const blocMin=b=>dur(b.debut,b.fin);
function workPlanned(d1,d2,m){let t=0;for(let d=d1;d<=d2;d=addD(d,1))for(const b of blocksFor(d))if(!b.fixe&&isWork(b.kind)&&(!m||b.matiere===m))t+=blocMin(b);return t}
function workDone(d1,d2){const per={};let t=0;const add=(m,x)=>{t+=x;per[m||'Autre']=(per[m||'Autre']||0)+x};
 for(let d=d1;d<=d2;d=addD(d,1))for(const b of blocksFor(d))if(!b.fixe&&isWork(b.kind)&&(b.fait===true||b.fait==='Oui'))add(b.matiere,blocMin(b));
 for(const s of S.seances)if(s.date>=d1&&s.date<=d2&&!s.bloc)add(s.matiere,dur(s.debut,s.fin)||(+s.minutes||0));
 return{t,per}}
/* jours travaillés consécutifs */
function activeDays(){const s=new Set();for(const x of S.seances)s.add(x.date);for(const b of S.blocs)if(b.fait===true&&isWork(b.kind))s.add(b.date);for(const e of S.exercices)if(e.dateFait)s.add(e.dateFait);for(const r of S.revisions)for(const h of r.historique||[])s.add(h.date);for(const x of S.examens)if(x.fin)s.add(x.fin.slice(0,10));return s}
function streak(){const s=activeDays();let n=0,d=TD();if(!s.has(d))d=addD(d,-1);while(s.has(d)){n++;d=addD(d,-1)}return n}
/* maîtrise des chapitres : preuves réelles, pondérées et récentes */
const RES={'Réussi':1,'Partiellement':.5,'Raté':0},RATE={facile:1,moyen:.6,difficile:.2};
function evidences(m){const E={};const add=(ch,v,d,w,src)=>{for(const c of[].concat(ch).flatMap(t=>String(t||'').split(/\s*[;,]\s*/)).filter(Boolean)){const k=norm(c);(E[k]=E[k]||{nom:c,ev:[],err:0}).ev.push({v,d,w,src})}};
 for(const x of notesOf(m))if(x.chapitres)add(x.chapitres,n20(x)/20,x.date,2,'Note');
 for(const x of S.examens)if(x.matiere===m&&x.note!=null&&x.note!==''&&+x.bareme)add(x.chapitres||x.chapitre,+x.note/+x.bareme,(x.fin||x.cree||'').slice(0,10),1.5,'DS d’entraînement');
 for(const x of S.exercices)if(x.matiere===m&&RES[x.resultat]!=null)add(x.chapitre,RES[x.resultat],x.dateFait||'',.7,'Exercice');
 for(const r of S.revisions)if(r.matiere===m)for(const h of r.historique||[])if(RATE[h.res]!=null)add(r.chapitre||r.notion,RATE[h.res],h.date,.5,'Révision');
 for(const q of S.questions)if(q.matiere===m)for(const h of q.hist||[])add(q.chapitre,h.ok,h.date,.4,'Question de cours');

function recFor(d){return S.recurrences.filter(r=>recOn(r,d)).map(r=>({titre:r.titre,description:r.description,matiere:r.matiere,chapitre:r.chapitre,kind:r.kind||'revision',icone:r.icone,priorite:r.priorite,rappel:r.rappel,sousTaches:(r.sousTaches||[]).map(t=>({t:t.t||t,ok:false})),debut:r.debut,fin:r.fin,id:'r_'+r.id+'_'+d,rec:r.id,src:'rec',date:d}))}
function blocksFor(d){const skip=new Set(S.blocs.filter(x=>x.date===d&&x.skip).map(x=>x.ref)),over=new Set(S.blocs.filter(x=>x.recInst).map(x=>x.recInst));
 const own=S.blocs.filter(x=>x.date===d&&!x.skip&&x.debut).map(x=>({...x,src:'blocs'}));
 const pl=S.planning.filter(x=>x.date===d).map(x=>({...x,titre:x.objectif||x.chapitre,kind:'revision',src:'planning'}));
 return [...fixedFor(d),...recFor(d).filter(x=>!over.has(x.id)),...own,...pl].filter(x=>!skip.has(x.id)).sort((a,b)=>mn(a.debut)-mn(b.debut))}
const blkCol=b=>b.couleur||(b.kind==='sport'?'var(--ok)':['cours','trajet','sommeil'].includes(b.kind)?'var(--mute)':b.kind==='perso'||b.kind==='pause'?'var(--m4)':COL(b.matiere)||'var(--acc)');

function dueChips(d){const c=S.controles.filter(x=>x.date===d),t=S.taches.filter(x=>x.date===d);if(!c.length&&!t.length)return '';return `<div class="sp" style="margin-bottom:10px">${c.map(x=>`<span class="tag wrap ${x.type==='Travail à faire'?'':'b'}">${x.type==='Travail à faire'?'✏️ À rendre : '+esc(x.chapitres):'📝 '+esc(x.type)+' '+esc(SH(x.matiere))+(x.chapitres?' — '+esc(x.chapitres):'')}</span>`).join('')}${t.map(x=>`<span class="tag wrap">✏️ À rendre : ${esc(x.titre)}</span>`).join('')}</div>`}
function dayView(){const base=monday(aDay);const ds=[];for(let i=-7;i<14;i++)ds.push(addD(base,i));const wp=workPlanned(aDay,aDay),mx=R().maxSoir;

 <aside class="g" style="align-content:start">${inboxCard()}${toPlaceCard()}${lateCard()}${recCard()}${remindCard()}</aside></div>`}
function timeline(d){const bl=blocksFor(d),px=m=>(m-T0)/60*HPX;let h='';for(let t=7;t<=24;t++)h+=`<div class="hr" style="top:${(t-7)*HPX}px"><span>${t<24?t+'h':''}</span></div>`;
 // colonnes en cas de chevauchement
 const cl=[];let grp=[],end=0;for(const b of bl){const s=mn(b.debut),e=mn(b.fin)||1440;if(grp.length&&s>=end){cl.push(grp);grp=[];end=0}grp.push(b);end=Math.max(end,e)}if(grp.length)cl.push(grp);
 for(const g of cl){const cols=[];for(const b of g){let c=0;while(cols[c]!=null&&cols[c]>mn(b.debut))c++;cols[c]=mn(b.fin)||1440;b._c=c}const n=cols.length;
  for(const b of g){const s=Math.max(mn(b.debut),T0),e=Math.min(mn(b.fin)||1440,1440);if(e<=T0)continue;const top=px(s),ht=Math.max(24,(e-s)/60*HPX-3),work=!b.fixe&&b.kind!=='sommeil',done=isDone(b),late=work&&isWork(b.kind)&&!done&&(d<TD()||(d===TD()&&e<nowMin()));
   h+=`<div class="blk ${b.fixe?'fix':''} ${work?'work':''} ${done?'done':''} ${late?'late':''}" data-k="${esc(bkey(b))}" style="top:${top}px;height:${ht}px;width:calc(${100/n}% - 4px);left:calc(${b._c*100/n}% + ${b._c?4:0}px);--c:${blkCol(b)}">${ht>30?`<span class="ic">${b.icone||ICONS[b.kind]||'✏️'}</span>`:''}<div style="min-width:0;flex:1"><div class="bt">${esc(b.titre)}</div>${ht>36?`<div class="bs">${esc(b.debut)}–${esc(b.fin)}${b.sous?' · '+esc(b.sous):b.matiere?' · '+esc(SH(b.matiere)):''}${subCount(b)?' · ☑ '+subCount(b):''}${late?' · en retard':''}${b.rappel!==''&&b.rappel!=null?' · 🔔':''}</div>`:''}</div><div class="bx">${work&&isWork(b.kind)?`<input type="checkbox" aria-label="Terminé" data-bdone="${esc(bkey(b))}" ${done?'checked':''}>`:''}${b.fixe?`<button class="link" aria-label="Masquer ce jour" data-bskip="${esc(b.id)}|${d}" style="min-height:22px;padding:0 3px">×</button>`:''}</div>${work?'<div class="rz"></div>':''}</div>`}}
 if(d===TD()){const m=nowMin();if(m>=T0)h+=`<div class="now" style="top:${px(m)}px"></div>`}return h}
function weekView(){const mo=monday(aDay),H=30,ds=Array.from({length:7},(_,i)=>addD(mo,i));let h=`<div class="card" style="overflow-x:auto"><div class="week" style="min-width:560px"><div></div>${ds.map(d=>`<div class="wh ${d===TD()?'today':''}" data-gday="${d}">${fd(d,{weekday:'short'})}<b>${+d.slice(8)}</b>${S.controles.filter(c=>c.date===d&&c.type!=='Travail à faire').map(c=>`<span class="tag b" style="font-size:10px">📝 ${esc(SH(c.matiere))}</span>`).join('')}${S.controles.filter(c=>c.date===d&&c.type==='Travail à faire').length+S.taches.filter(t=>t.date===d).length?'<span class="tag" style="font-size:10px">✏️ devoir</span>':''}</div>`).join('')}

function monthView(){const f=aDay.slice(0,8)+'01',start=monday(f),mx=R().maxSoir;let h=`<div class="card"><div class="month">${['lun','mar','mer','jeu','ven','sam','dim'].map(x=>`<div class="mh">${x}</div>`).join('')}`;
 for(let i=0;i<42;i++){const d=addD(start,i);if(i>=35&&d.slice(0,7)!==f.slice(0,7))break;const ev=S.controles.filter(c=>c.date===d),tk=S.taches.filter(t=>t.date===d),bl=blocksFor(d).filter(b=>!b.fixe),df=S.defis.filter(x=>x.fin===d&&x.statut!=='Terminé'),w=workPlanned(d,d);const busy=w>mx||ev.filter(c=>c.type!=='Travail à faire').length>=2;

function freeSlot(d,len){const bl=blocksFor(d),w=(cfg().semaine||{})[dt(d).getDay()]||{};let st=Math.max(w.ly?mn(w.ly[1])+50:14*60,d===TD()?nowMin()+10:0);st=Math.ceil(st/15)*15;const lim=mn(R().coucher)-60;

function freeWindows(d){const bl=blocksFor(d),w=(cfg().semaine||{})[dt(d).getDay()]||{};let st=Math.max(w.ly?mn(w.ly[1])+40:dt(d).getDay()%6===0?9*60:14*60,d===TD()?Math.ceil((nowMin()+10)/15)*15:0);const lim=mn(R().coucher)-60,out=[];let a=null;

function fixTex(o){if(typeof o==='string')return o.replace(/\f/g,'\\f').replace(/\x08/g,'\\b').replace(/\t(?=(imes|ext|heta|an|o\b|frac|riangle))/g,'\\t').replace(/\r(?=(ight|ho|angle|m\b))/g,'\\r').replace(/\n(?=(eq|abla|u\b|ot|e\b|otin|ewline|i\b))/g,'\\n');if(Array.isArray(o))return o.map(fixTex);if(o&&typeof o==='object'){for(const k in o)o[k]=fixTex(o[k]);return o}return o}
function parseClaude(txt){const out=[],errs=[];const re=/```(?:studyos|json)?\s*\n([\s\S]*?)```/g;let m,blocks=[];while((m=re.exec(txt)))blocks.push(m[1]);if(!blocks.length){const a=txt.indexOf('{'),b=txt.lastIndexOf('}');if(a>=0&&b>a)blocks.push(txt.slice(a,b+1))}
 for(const b of blocks){let j=null;try{j=JSON.parse(b)}catch(e){try{j=JSON.parse(b.replace(/\\(?!["\\/bfnrtu])/g,'\\\\'))}catch(e2){errs.push(e.message)}}if(j){for(const x of[].concat(j))if(x&&x.type&&SPEC[x.type])out.push(fixTex(x))}}return{out,errs}}
function importDlg(pre=''){ask('Importer une réponse de Claude',`<label class="w">Colle ici toute la réponse de Claude (ou seulement le bloc studyos)<textarea name="t" rows="9" placeholder="\`\`\`studyos { … } \`\`\`">${esc(pre)}</textarea></label><p class="note w">Rien n’est enregistré avant ta validation à l’étape suivante.</p>`,'Analyser',v=>{const{out,errs}=parseClaude(v.t||'');if(!out.length){banner(errs.length?'Le bloc studyos est illisible (JSON invalide : '+esc(errs[0])+'). Demande à Claude : « renvoie uniquement le bloc studyos corrigé ».':'Aucun bloc studyos trouvé dans le texte collé. Vérifie que tu as copié toute la réponse.','err');return false}setTimeout(()=>previewImport(out),50)},{plain:true})}
function errKey(e){return norm(e.description).split(' ').filter(w=>w.length>3)}
function findErr(e){const k=new Set(errKey(e));let best=null,bs=0;for(const x of S.erreurs){if(x.matiere!==e.matiere)continue;if(norm(x.description)===norm(e.description))return x;const kx=errKey(x);if(!kx.length||!k.size)continue;const inter=kx.filter(w=>k.has(w)).length,j=inter/(new Set([...kx,...k]).size);const sc=j+(x.typeErreur===e.typeErreur?.15:0)+(norm(x.chapitre)&&norm(x.chapitre)===norm(e.chapitre)?.15:0);if(sc>bs){bs=sc;best=x}}return bs>=.55?best:null}
async function mergeErrors(list,src,date){let n=0,u=0;for(const e of list||[]){if(!e.description)continue;const x=findErr(e);if(x){await put('erreurs',{...x,occurrences:(+x.occurrences||1)+1,derniere:date||TD(),statut:'Active',question:x.question||e.question,reponse:e.reponse||x.reponse,explication:x.explication||e.explication,methode:x.methode||e.methode,chapitre:x.chapitre||e.chapitre,sources:[...(x.sources||[]),src].slice(-10)},true);u++}else{await put('erreurs',{matiere:e.matiere,chapitre:e.chapitre||'',typeErreur:e.typeErreur||'',question:e.question||'',reponse:e.reponse||'',description:e.description,explication:e.explication||'',methode:e.methode||'',cause:e.cause||'',portee:e.portee||'',occurrences:1,premiere:date||TD(),derniere:date||TD(),statut:'Active',origine:'Claude',sources:[src]},true);n++}}later();return{n,u}}

function vCalc(){if(cObj==null)cObj=R().objectif;if(!cRows)cRows=evals(90,cM).map(c=>({l:c.type+' '+(c.chapitres||'')+' ('+fd(c.date)+')',b:c.type==='Interrogation'?10:20,c:1,n:''}));if(!cRows.length)cRows=[{l:'Prochaine évaluation',b:20,c:1,n:''}];
 const L=notesOf(cM,cPer);let A=0,B=0;for(const x of L){A+=pts(x)*coef(x);B+=x.bareme*coef(x)}const cur=B?A/B*20:null,F=cRows.reduce((s,r)=>s+(+r.b||0)*(+r.c||0),0);
 const need=F?(cObj*(B+F)/20-A)/F*20:null,maxR=F?(A+F)/(B+F)*20:null,res=n=>F||B?(A+n/20*F)/(B+F)*20:null;
 const filled=cRows.every(r=>r.n!==''&&r.n!=null),sim=filled&&F?(A+cRows.reduce((s,r)=>s+(+r.n)/(+r.b)*(+r.b)*(+r.c),0))/(B+F)*20:null;
 return `<div class="top"><div><h1>Calculateur d’objectif</h1><p>Calcul exact avec tes notes enregistrées (statut « Renseignée ») et leurs coefficients, comme Pronote : Σ(points × coef) ÷ Σ(barème × coef) × 20.</p></div></div>
 <div class="g g2"><div class="card"><h2>Paramètres</h2><div class="f"><label>Matière${sel('cm',MAT(),cM,'id="cM"')}</label><label>Période${sel('cp',Object.entries(PERS),cPer,'id="cP"')}</label>${inp('Objectif de moyenne','cobj',cObj,'number','id="cObj" min="0" max="20" step="0.5"')}</div>
 <p class="mt">Moyenne actuelle : <b>${cur==null?'aucune note':nf(cur)}</b> <span class="sub">(${L.length} note${L.length>1?'s':''}, ${nfs(A)} points sur ${nfs(B)} pondérés)</span></p>
 <h3 class="mt">Évaluations à venir</h3><div id="cRows">${cRows.map((r,i)=>`<div class="sp" style="margin:6px 0;flex-wrap:nowrap"><input value="${esc(r.l)}" data-cr="${i}|l" class="grow" placeholder="Évaluation"><input type="number" value="${esc(r.b)}" data-cr="${i}|b" style="width:70px" min="1" title="Barème"><input type="number" value="${esc(r.c)}" data-cr="${i}|c" style="width:62px" step="0.1" min="0" title="Coefficient"><input type="number" value="${esc(r.n)}" data-cr="${i}|n" style="width:80px" step="0.25" min="0" placeholder="note ?" title="Note simulée"><button class="icon" data-crdel="${i}" aria-label="Retirer">✕</button></div>`).join('')}</div>
 <p class="note">Colonnes : intitulé · barème · coefficient · note simulée (facultative).</p><button class="sm sec" data-act="crAdd">+ Évaluation</button></div>
 <div class="card"><h2>Résultat</h2>${!F?'<p class="empty">Ajoute au moins une évaluation future.</p>':need>20?`<div class="banner err">Objectif impossible avec les évaluations connues : même avec la note maximale partout, la moyenne atteindrait ${nf(maxR)}.</div>`:need<=0?`<div class="banner ok">Objectif déjà assuré : même avec 0, ta moyenne resterait à ${nf(res(0))}.</div>`:`<div class="kpi"><small>Note nécessaire à chaque évaluation (sur 20)</small><b>${nf(need)}</b><span>pour atteindre ${nfs(cObj)} de moyenne</span></div>`}
 ${F?`<h3 class="mt">Scénarios</h3><table><thead><tr><th>Si tu obtiens</th><th class="n">Moyenne finale</th><th></th></tr></thead><tbody>${[12,14,16,18].map(n=>{const r=res(n);return `<tr><td>${n}/20 partout</td><td class="n"><b>${nf(r)}</b></td><td class="n">${r>=cObj?'<span class="tag o">objectif atteint</span>':'<span class="tag">manque '+nf(cObj-r)+'</span>'}</td></tr>`}).join('')}${sim!=null?`<tr><td>Tes notes simulées</td><td class="n"><b>${nf(sim)}</b></td><td class="n">${sim>=cObj?'<span class="tag o">objectif atteint</span>':''}</td></tr>`:''}</tbody></table>`:''}
 <p class="note">Les évaluations futures sont prises sur 20 équivalent (une note de 14/20 à une interro sur 10 = 7/10).</p></div></div>`}

const isoX=v=>{if(v instanceof Date&&!isNaN(v))return iso(new Date(v.getTime()+432e5));if(typeof v==='string'&&/^\d{2}\/\d{2}\/\d{4}$/.test(v)){const[d,mo,y]=v.split('/');return `${y}-${mo}-${d}`}return v?String(v):''};
